name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read # Both validation jobs check out the candidate without write authority.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-setup-tests:
    name: Verify Windows local setup orchestration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exercise startup sequencing and failure isolation
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/tests/start-local.Tests.ps1

  ci-complete:
    name: ci-complete
    if: always()
    needs:
      - build-and-test
      - local-setup-tests
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          SETUP_RESULT: ${{ needs.local-setup-tests.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$SETUP_RESULT" = success

  build-and-test:
    name: Build and test Search
    permissions:
      contents: read # Checkout reads the candidate and its MinVer history.
      packages: read # The Search closure restores packages from other Concertable repositories.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # MinVer needs the history to compute the height the publish will use.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan source for secrets
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/work:ro"
          --volume "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          filesystem --scanners secret --exit-code 1 --timeout 30m --no-progress /work

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.x

      - name: Restore Search solution
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
        run: dotnet restore Concertable.Search.slnx

      - name: Build Search solution
        run: dotnet build Concertable.Search.slnx --configuration Release --no-restore

      - name: Build and inspect Search images without publishing
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
        run: >-
          ./scripts/verify-search-images.ps1
          -WebImage "concertable/search-web:verification-$env:GITHUB_SHA"
          -WorkersImage "concertable/search-workers:verification-$env:GITHUB_SHA"
          -MigrationsImage "concertable/search-migrations:verification-$env:GITHUB_SHA"
          -BuildVersion "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          -KeepImages

      - name: Scan Search image vulnerabilities and secrets
        shell: pwsh
        run: |
          foreach ($image in @(
            "concertable/search-web:verification-$env:GITHUB_SHA",
            "concertable/search-workers:verification-$env:GITHUB_SHA",
            "concertable/search-migrations:verification-$env:GITHUB_SHA"
          )) {
            foreach ($scanner in @(
              @{ Name = 'vulnerabilities'; Arguments = @('--scanners', 'vuln', '--severity', 'CRITICAL') },
              @{ Name = 'secrets'; Arguments = @('--scanners', 'secret') }
            )) {
              $arguments = @(
                'run', '--rm',
                '--volume', '/var/run/docker.sock:/var/run/docker.sock',
                '--volume', "$env:RUNNER_TEMP/trivy-cache:/root/.cache/trivy",
                'aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969',
                'image'
              ) + $scanner.Arguments + @('--exit-code', '1', '--no-progress', $image)
              & docker @arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Search image $($scanner.Name) scan failed for '$image'."
              }
            }
          }

      - name: Generate and verify Search image SBOMs
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'search-image-evidence'
          New-Item -ItemType Directory -Path $evidence | Out-Null
          foreach ($item in @(
            @{ Image = "concertable/search-web:verification-$env:GITHUB_SHA"; File = 'search-web.cdx.json' },
            @{ Image = "concertable/search-workers:verification-$env:GITHUB_SHA"; File = 'search-workers.cdx.json' },
            @{ Image = "concertable/search-migrations:verification-$env:GITHUB_SHA"; File = 'search-migrations.cdx.json' }
          )) {
            docker run --rm `
              --volume /var/run/docker.sock:/var/run/docker.sock `
              --volume "${evidence}:/evidence" `
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 `
              image --format cyclonedx --output "/evidence/$($item.File)" $item.Image
            if ($LASTEXITCODE -ne 0) {
              throw "SBOM generation failed for $($item.Image)."
            }

            $sbom = Get-Content -Raw -LiteralPath (Join-Path $evidence $item.File) | ConvertFrom-Json
            if ($sbom.bomFormat -ne 'CycloneDX' -or @($sbom.components).Count -eq 0) {
              throw "SBOM validation failed for $($item.Image)."
            }
          }

      - name: Publish Search migration job
        run: dotnet publish api/src/Concertable.Search.Migrations/Concertable.Search.Migrations.csproj --configuration Release --no-restore --output artifacts/migrations

      - name: Pack Search Hosting
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
        run: dotnet pack api/src/Concertable.Search.Hosting/Concertable.Search.Hosting.csproj --configuration Release --output artifacts/packages -p:MinVerVersionOverride=0.0.0-ci.$GITHUB_RUN_NUMBER

      - name: Verify package candidates from a clean consumer
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
        run: ./scripts/verify-package-candidates.ps1 -PackageDirectory artifacts/packages

      # The org packages token, not GITHUB_TOKEN: a dependency image published by another repository
      # grants that repository's own Actions access, and nothing grants this one. GITHUB_TOKEN worked
      # only for images old enough to predate the repository split.
      - name: Log in to GHCR for standalone dependency images
        env:
          TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
          GHCR_USERNAME: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Upload package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-packages-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration job candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-migrations-${{ github.sha }}
          path: artifacts/migrations/**
          if-no-files-found: error
          retention-days: 7

      - name: Verify combined Search release candidate without publishing
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CONCERTABLE_PACKAGES_READ }}
        run: >-
          ./scripts/verify-search-release-candidate.ps1
          -Configuration Release
          -OutputPath "$env:RUNNER_TEMP/search-release-candidate"

      - name: Trust HTTPS for the isolated Search runtime
        run: |
          set -euo pipefail
          export DOTNET_DEV_CERTS_OPENSSL_CERTIFICATE_DIRECTORY="$RUNNER_TEMP/search-dev-certs"
          export SSL_CERT_DIR="$DOTNET_DEV_CERTS_OPENSSL_CERTIFICATE_DIRECTORY:/usr/lib/ssl/certs"
          dotnet dev-certs https --trust
          dotnet dev-certs https --check --trust
          printf '%s\n' "DOTNET_DEV_CERTS_OPENSSL_CERTIFICATE_DIRECTORY=$DOTNET_DEV_CERTS_OPENSSL_CERTIFICATE_DIRECTORY" "SSL_CERT_DIR=$SSL_CERT_DIR" >> "$GITHUB_ENV"

      - name: Test Search solution
        run: dotnet test Concertable.Search.slnx --configuration Release --no-build --no-restore -m:1

      - name: Clean Search image verification artifacts
        if: always()
        shell: pwsh
        run: |
          foreach ($image in @(
            "concertable/search-web:verification-$env:GITHUB_SHA",
            "concertable/search-workers:verification-$env:GITHUB_SHA",
            "concertable/search-migrations:verification-$env:GITHUB_SHA"
          )) {
            $imageIds = @(docker image ls --quiet $image)
            if ($LASTEXITCODE -ne 0) {
              throw "Could not query verification image '$image'."
            }
            if ($imageIds.Count -gt 0) {
              $inspection = docker image inspect $image | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) {
                throw "Could not inspect verification image '$image'."
              }
              if ($inspection[0].Config.Labels.'org.opencontainers.image.source' -ne 'https://github.com/Concertable/search' -or
                  $inspection[0].Config.Labels.'org.opencontainers.image.revision' -ne $env:GITHUB_SHA) {
                throw "Refusing to remove image '$image' because it is not owned by this Search revision."
              }
              docker image rm --force $image
              if ($LASTEXITCODE -ne 0) {
                throw "Could not remove verification image '$image'."
              }
            }
          }
          $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $evidencePath = [IO.Path]::GetFullPath((Join-Path $temporaryRoot 'search-image-evidence'))
          if ([IO.Path]::GetRelativePath($temporaryRoot, $evidencePath) -ne 'search-image-evidence') {
            throw 'Refusing to remove evidence outside the runner temporary directory.'
          }
          Remove-Item -LiteralPath $evidencePath -Recurse -Force -ErrorAction SilentlyContinue
