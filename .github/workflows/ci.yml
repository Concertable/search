name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build Search Web
        run: dotnet build src/Concertable.Search.Web/Concertable.Search.Web.csproj --configuration Release

      - name: Build Search Workers
        run: dotnet build src/Concertable.Search.Workers/Concertable.Search.Workers.csproj --configuration Release

      - name: Publish Search migration job
        run: dotnet publish src/Concertable.Search.Migrations/Concertable.Search.Migrations.csproj --configuration Release --output artifacts/migrations

      - name: Pack Search Hosting
        run: dotnet pack src/Concertable.Search.Hosting/Concertable.Search.Hosting.csproj --configuration Release --output artifacts/packages

      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: search-hosting-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration job candidate
        uses: actions/upload-artifact@v4
        with:
          name: search-migrations-${{ github.sha }}
          path: artifacts/migrations/**
          if-no-files-found: error
          retention-days: 7

      - name: Run unit tests
        run: dotnet test tests/Concertable.Search.UnitTests/Concertable.Search.UnitTests.csproj --configuration Release

      - name: Run integration tests
        run: dotnet test tests/Concertable.Search.IntegrationTests/Concertable.Search.IntegrationTests.csproj --configuration Release
