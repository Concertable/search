name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-complete:
    name: ci-complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore Search solution
        run: dotnet restore Concertable.Search.slnx

      - name: Build Search solution
        run: dotnet build Concertable.Search.slnx --configuration Release --no-restore

      - name: Build Search Web container
        run: docker build --target search-web --build-arg BUILD_VERSION=0.0.0-ci.${{ github.run_number }} --secret id=GITHUB_PACKAGES_TOKEN,env=GITHUB_PACKAGES_TOKEN --tag concertable-search-web:${{ github.sha }} .

      - name: Build Search Workers container
        run: docker build --target search-workers --build-arg BUILD_VERSION=0.0.0-ci.${{ github.run_number }} --secret id=GITHUB_PACKAGES_TOKEN,env=GITHUB_PACKAGES_TOKEN --tag concertable-search-workers:${{ github.sha }} .

      - name: Build Search migration container
        run: docker build --target search-migrations --build-arg BUILD_VERSION=0.0.0-ci.${{ github.run_number }} --secret id=GITHUB_PACKAGES_TOKEN,env=GITHUB_PACKAGES_TOKEN --tag concertable-search-migrations:${{ github.sha }} .

      - name: Publish Search migration job
        run: dotnet publish src/Concertable.Search.Migrations/Concertable.Search.Migrations.csproj --configuration Release --no-restore --output artifacts/migrations

      - name: Pack Search Hosting
        run: dotnet pack src/Concertable.Search.Hosting/Concertable.Search.Hosting.csproj --configuration Release --output artifacts/packages -p:MinVerVersionOverride=0.0.0-ci.${{ github.run_number }}

      - name: Pack Search TestKit
        run: dotnet pack src/Concertable.Search.TestKit/Concertable.Search.TestKit.csproj --configuration Release --output artifacts/packages -p:MinVerVersionOverride=0.0.0-ci.${{ github.run_number }}

      - name: Verify package candidates from a clean consumer
        shell: pwsh
        run: ./scripts/verify-package-candidates.ps1 -PackageDirectory artifacts/packages

      - name: Log in to GHCR for standalone dependency images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: search-packages-${{ github.sha }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload migration job candidate
        uses: actions/upload-artifact@v4
        with:
          name: search-migrations-${{ github.sha }}
          path: artifacts/migrations/**
          if-no-files-found: error
          retention-days: 7

      - name: Test Search solution
        run: dotnet test Concertable.Search.slnx --configuration Release --no-build --no-restore -m:1 --logger "console;verbosity=detailed"
